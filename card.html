<style>

*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f7f7f8;color:#111}
button,input,textarea,select{font-family:inherit}
.top{height:72px;background:#fff;border-bottom:1px solid #e9e9e9;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.logo{font-size:30px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0 0;color:#666;font-size:13px}
.topBtns{display:flex;gap:10px}button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#e84f7f;color:#fff;border-color:#e84f7f}.danger{color:#e84f7f}
.wrap{display:grid;grid-template-columns:minmax(520px, 34%) minmax(360px, 28%) minmax(460px, 38%);min-height:calc(100vh - 72px);background:#fff}
.side,.assets,.editor,.preview{padding:20px;border-right:1px solid #eee}.preview{border-right:0;background:#fafafa}
h2{font-size:17px;margin:0 0 18px} label{display:block;margin:14px 0 7px;font-size:13px;font-weight:900}
.catListGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cat{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #eee;border-radius:10px;background:#fff;font-weight:800;font-size:12px;line-height:1.15;cursor:pointer;padding:2px 1px;text-align:center}.cat span:first-child{font-size:18px}
.cat.active{border-color:#e84f7f;background:#fff2f6;color:#df336b}
.designGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.designSwatch{height:64px;border:1px solid #ddd;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);background-size:cover;background-position:center;background-color:#f5f5f5}
.designSwatch.active{outline:3px solid #e84f7f}
.typeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.typeBtn{font-size:11px;padding:6px 2px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}.typeBtn.active{border-color:#e84f7f;background:#fff2f6;color:#df336b}.typePreview{display:block;width:28px;height:38px;flex-shrink:0}.typePreview svg{width:100%;height:100%;display:block}.typeName{font-weight:600}
input,textarea,select{width:100%;border:1px solid #ddd;border-radius:8px;padding:11px;font-size:14px;background:#fff}
textarea{min-height:118px;resize:vertical;line-height:1.45}
.upload{border:1px dashed #aaa;border-radius:10px;padding:18px;text-align:center;background:#fff;margin-top:8px}.upload input{display:none}.upload label{margin:0;cursor:pointer}
.bgGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-height:320px;overflow:auto;margin-top:18px;padding:3px}
.bgThumb{height:105px;background-size:cover;background-position:center;border:1px solid #ddd;border-radius:9px;position:relative;cursor:pointer}
.bgThumb.active{outline:3px solid #e84f7f}.bgThumb span{position:absolute;left:6px;top:5px;background:rgba(0,0,0,.48);color:#fff;padding:2px 7px;border-radius:8px;font-size:12px;font-weight:900}
.empty{border:1px dashed #ccc;border-radius:10px;padding:18px;color:#777;font-size:13px;line-height:1.6;text-align:center}
.notice{font-size:12px;color:#666;line-height:1.5;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rangeRow{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center}
.colorRow{display:flex;gap:8px;flex-wrap:wrap}.sw{width:28px;height:28px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.sw.active{box-shadow:0 0 0 3px #e84f7f}
.alignBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.alignBtns button.active{border-color:#e84f7f;background:#fff2f6;color:#df336b}
.cardBox{display:flex;justify-content:center;align-items:flex-start;padding-top:28px}
#card{width:560px;aspect-ratio:1/1.414;border-radius:12px;overflow:hidden;position:relative;background-size:cover;background-position:center;box-shadow:0 12px 35px rgba(0,0,0,.15), inset 0 0 0 14px #fff, inset 0 0 0 15px rgba(180,150,120,.18)}
/* #card:before now defined per type */
.cardText{position:absolute;z-index:3;inset:72px 58px;text-align:center;text-shadow:0 2px 5px rgba(0,0,0,.18);--msgTop:55px;--senderTop:620px;--msgWidth:92%}
.title,.to,.deco,.msg,.from,.date{position:absolute;left:0;right:0;margin:0}
.title{top:0;font-size:38px;font-weight:900}.to{top:78px;font-size:18px;font-weight:800}.deco{top:118px;font-size:20px;color:#e84f7f;font-weight:800}
.msg{top:calc(155px + var(--msgTop));white-space:pre-wrap;font-weight:700;line-height:1.18}.from{top:var(--senderTop);font-size:18px;font-weight:800}.date{top:calc(var(--senderTop) + 38px);font-size:16px;font-weight:700}
/* ===== CARD TYPE OVERLAYS (upgraded) ===== */
.gridOverlay,.postcardOverlay,.splitOverlay,.ribbonOverlay,.envelopeOverlay{display:none;position:absolute;inset:0;z-index:1;pointer-events:none}

/* --- 1. BASIC TYPE: elegant double border + corner ornaments --- */
#card.type-basic:before{
  content:"";position:absolute;inset:18px;
  border:1px solid rgba(170,120,90,.55);
  z-index:2;pointer-events:none;border-radius:2px;
}
#card.type-basic:after{
  content:"";position:absolute;inset:26px;
  border:1px solid rgba(170,120,90,.28);
  z-index:2;pointer-events:none;border-radius:2px;
}
#card.type-basic .gridOverlay{display:block}
#card.type-basic .gridOverlay:before,
#card.type-basic .gridOverlay:after{
  content:"";position:absolute;width:36px;height:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><g fill='none' stroke='%23aa785a' stroke-width='1.2' stroke-opacity='0.65' stroke-linecap='round'><path d='M4 32 Q4 16, 18 14 Q22 14, 26 10'/><path d='M4 32 Q12 24, 22 22'/><circle cx='26' cy='10' r='2' fill='%23c98a5e' fill-opacity='0.55'/><circle cx='10' cy='26' r='1.4' fill='%23c98a5e' fill-opacity='0.45'/></g></svg>") center/contain no-repeat;
}
#card.type-basic .gridOverlay:before{top:14px;left:14px}
#card.type-basic .gridOverlay:after{bottom:14px;right:14px;transform:rotate(180deg)}
#card.type-basic .postcardOverlay{display:block}
#card.type-basic .postcardOverlay:before,
#card.type-basic .postcardOverlay:after{
  content:"";position:absolute;width:36px;height:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><g fill='none' stroke='%23aa785a' stroke-width='1.2' stroke-opacity='0.65' stroke-linecap='round'><path d='M4 32 Q4 16, 18 14 Q22 14, 26 10'/><path d='M4 32 Q12 24, 22 22'/><circle cx='26' cy='10' r='2' fill='%23c98a5e' fill-opacity='0.55'/><circle cx='10' cy='26' r='1.4' fill='%23c98a5e' fill-opacity='0.45'/></g></svg>") center/contain no-repeat;
}
#card.type-basic .postcardOverlay:before{top:14px;right:14px;transform:scaleX(-1)}
#card.type-basic .postcardOverlay:after{bottom:14px;left:14px;transform:scaleY(-1)}

/* --- 2. GRID TYPE: soft dotted grid + corner flourish --- */
#card.type-grid .gridOverlay{display:block}
#card.type-grid .gridOverlay{
  background-image:
    radial-gradient(circle, rgba(255,255,255,.5) 1.2px, transparent 1.6px),
    radial-gradient(circle, rgba(170,120,90,.18) 1px, transparent 1.4px);
  background-size:48px 48px, 48px 48px;
  background-position:0 0, 24px 24px;
}
#card.type-grid:before{
  content:"";position:absolute;inset:18px;
  border:1px dashed rgba(170,120,90,.4);
  z-index:2;pointer-events:none;border-radius:2px;
}

/* --- 3. FRAME TYPE: 3D beveled photo frame with gold corners --- */
#card.type-frame:after{
  content:"";position:absolute;inset:30px;
  border:6px solid rgba(255,255,255,.92);
  box-shadow:
    0 0 0 2px rgba(170,120,90,.45),
    inset 0 0 0 1px rgba(170,120,90,.3),
    0 4px 14px rgba(0,0,0,.18) inset,
    0 -2px 8px rgba(0,0,0,.08) inset;
  z-index:2;pointer-events:none;border-radius:3px;
}
#card.type-frame .gridOverlay{display:block}
#card.type-frame .gridOverlay:before,
#card.type-frame .gridOverlay:after{
  content:"";position:absolute;width:28px;height:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><g fill='%23c9962e' fill-opacity='0.85'><path d='M2 2 L14 2 L14 6 L6 6 L6 14 L2 14 Z'/><circle cx='6' cy='6' r='1.5' fill='%23a8761e'/></g></svg>") center/contain no-repeat;
  z-index:3;
}
#card.type-frame .gridOverlay:before{top:22px;left:22px}
#card.type-frame .gridOverlay:after{top:22px;right:22px;transform:scaleX(-1)}
#card.type-frame .postcardOverlay{display:block}
#card.type-frame .postcardOverlay:before,
#card.type-frame .postcardOverlay:after{
  content:"";position:absolute;width:28px;height:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><g fill='%23c9962e' fill-opacity='0.85'><path d='M2 2 L14 2 L14 6 L6 6 L6 14 L2 14 Z'/><circle cx='6' cy='6' r='1.5' fill='%23a8761e'/></g></svg>") center/contain no-repeat;
  z-index:3;
}
#card.type-frame .postcardOverlay:before{bottom:22px;left:22px;transform:scaleY(-1)}
#card.type-frame .postcardOverlay:after{bottom:22px;right:22px;transform:scale(-1,-1)}

/* --- 4. POSTCARD TYPE: realistic postcard - text centered, stamp + postmark at top-right --- */
#card.type-postcard:before{
  content:"";position:absolute;inset:20px;
  border:2px solid rgba(120,80,50,.5);
  z-index:2;pointer-events:none;border-radius:3px;
}
#card.type-postcard:after{
  content:"POST · CARD";
  position:absolute;left:30px;top:30px;
  font-family:Georgia, "Times New Roman", serif;
  font-size:11px;letter-spacing:4px;
  color:rgba(120,80,50,.6);font-weight:700;
  z-index:3;pointer-events:none;
}
#card.type-postcard{position:relative;}
/* Outer postcard double border */
#card.type-postcard:before{
  content:"";position:absolute;inset:14px;
  border:1.5px solid rgba(150,100,70,.5);
  z-index:2;pointer-events:none;border-radius:2px;
}
#card.type-postcard:after{
  content:"";position:absolute;inset:22px;
  border:1px dashed rgba(150,100,70,.32);
  z-index:2;pointer-events:none;border-radius:2px;
}
#card.type-postcard .postcardOverlay{display:block}
/* Stamp area removed entirely (per user request) */
#card.type-postcard .postcardOverlay:before{content:none;}
/* Decorative "POST CARD" tiny label at bottom for postcard identity */
#card.type-postcard .postcardOverlay:after{
  content:"P O S T   C A R D";
  position:absolute;left:0;right:0;bottom:32px;text-align:center;
  font-family:'Georgia',serif;font-size:9px;letter-spacing:5px;
  color:rgba(150,100,70,.5);font-weight:600;
  z-index:2;
}
/* Faint horizontal address lines as decorative bottom-left band (postcard back feel) */
#card.type-postcard .gridOverlay{display:block}
#card.type-postcard .gridOverlay:before{
  content:"";position:absolute;left:42px;bottom:60px;width:38%;height:52px;
  background:linear-gradient(to bottom,
    rgba(120,80,50,.32) 0 1px, transparent 1px 16px,
    rgba(120,80,50,.32) 16px 17px, transparent 17px 32px,
    rgba(120,80,50,.32) 32px 33px, transparent 33px);
  opacity:.7;
  z-index:1;
}


/* --- 5. SPLIT TYPE: elegant sidebar with divider line --- */
#card.type-split .splitOverlay{
  display:block;
  background:linear-gradient(90deg,rgba(255,255,255,.65) 0 32%,transparent 32% 33%,transparent 100%);
}
#card.type-split .splitOverlay:before{
  content:"";position:absolute;left:32%;top:50px;bottom:50px;width:1px;
  background:linear-gradient(180deg, transparent, rgba(170,120,90,.5) 15%, rgba(170,120,90,.5) 85%, transparent);
}
#card.type-split .splitOverlay:after{
  content:"";position:absolute;left:calc(16% - 18px);top:50%;width:36px;height:36px;transform:translateY(-50%);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><g fill='none' stroke='%23aa785a' stroke-width='1.3' stroke-opacity='0.6' stroke-linecap='round'><circle cx='18' cy='18' r='12'/><circle cx='18' cy='18' r='6' fill='%23c98a5e' fill-opacity='0.25'/><path d='M18 4 L18 8 M18 28 L18 32 M4 18 L8 18 M28 18 L32 18'/></g></svg>") center/contain no-repeat;
}
#card.type-split .cardText{inset:72px 44px 72px 220px}

/* Ribbon type deleted by request */

/* --- ENVELOPE TYPE (v7 final, C안): 봉투 뒷면 (사방 접힘선 + 중앙 봉인) --- */
#card.type-envelope{position:relative;overflow:hidden;}

/* 봉투 뒷면 배경 (살짝 어두운 베이지 톤 오버레이) */
#card.type-envelope:before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,
    rgba(220,195,170,0.2) 0%,
    rgba(200,170,140,0.14) 50%,
    rgba(220,195,170,0.2) 100%);
  z-index:1;pointer-events:none;
}

/* 외곽 봉투 테두리 */
#card.type-envelope:after{
  content:"";position:absolute;inset:0;
  border:2px solid rgba(130,85,55,.6);
  z-index:2;pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(255,250,240,.4);
}

/* 사방 4개 대각선 접힘선 - 모서리에서 중앙으로 */
#card.type-envelope .postcardOverlay{display:block}
#card.type-envelope .postcardOverlay:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to bottom right,
      transparent calc(50% - 0.8px),
      rgba(130,85,55,.55) calc(50% - 0.4px),
      rgba(130,85,55,.55) calc(50% + 0.4px),
      transparent calc(50% + 0.8px)),
    linear-gradient(to bottom left,
      transparent calc(50% - 0.8px),
      rgba(130,85,55,.55) calc(50% - 0.4px),
      rgba(130,85,55,.55) calc(50% + 0.4px),
      transparent calc(50% + 0.8px));
  z-index:3;pointer-events:none;
}

/* 4개 삼각형 영역 음영 (입체감) */
#card.type-envelope .postcardOverlay:after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to bottom,
      rgba(255,250,240,0.2) 0%,
      transparent 50%),
    linear-gradient(to top,
      rgba(130,85,55,0.12) 0%,
      transparent 50%);
  z-index:3;pointer-events:none;
}

/* 중앙 밀랍 봉인 (크기 적당히) */
#card.type-envelope .ribbonOverlay{display:block}
#card.type-envelope .ribbonOverlay:before{
  content:"";position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:50px;height:50px;border-radius:50%;
  background:
    radial-gradient(circle at 35% 28%,
      #ffd0dc 0%,
      #f5a8bc 30%,
      #e88aa5 60%,
      #d27090 90%,
      #b85e7e 100%);
  box-shadow:
    0 3px 8px rgba(180,90,120,.35),
    0 1px 3px rgba(180,90,120,.25),
    inset 0 -3px 6px rgba(150,70,100,.4),
    inset 0 3px 5px rgba(255,220,230,.6);
  z-index:10;pointer-events:none;
}

/* 봉인 안쪽 이중 원 장식 */
#card.type-envelope .ribbonOverlay:after{
  content:"";position:absolute;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:32px;height:32px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,
      transparent 0 10px,
      rgba(255,255,255,.45) 10px 11.5px,
      transparent 11.5px),
    radial-gradient(circle at 50% 50%,
      transparent 0 6px,
      rgba(255,230,240,.5) 6px 7.5px,
      transparent 7.5px),
    radial-gradient(circle at 50% 50%,
      rgba(255,235,242,.5) 0 2.5px,
      transparent 3px);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.45),
    0 0 4px rgba(255,255,255,.25);
  z-index:11;pointer-events:none;
}

/* 텍스트 영역: 카드 전체에 펼쳐서 from/date는 자연스럽게 아래쪽으로 */
#card.type-envelope .cardText{
  inset:48px 40px 48px 40px;
}
/* 봉인이 카드 정중앙(top:50%) 위치에 있으므로, 메시지는 봉인 위쪽 영역에 */
/* msg 박스의 top을 카드 위쪽 1/4로 강제하고, 봉인 직전(약 38%)에서 끝나도록 */
#card.type-envelope .msg{
  top:calc(96px + var(--msgTop)) !important;
  max-height:30%;
  overflow:hidden;
}
/* title과 to/deco도 위쪽으로 살짝 올려서 봉인과 거리 확보 */
#card.type-envelope .title{font-size:30px;}


.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:22px}.tip{margin-top:18px;border:1px solid #f1d58a;background:#fff9e8;border-radius:10px;padding:14px;font-size:13px;line-height:1.7}
#pwaInstallBox{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fff;border:1px solid #f0c4d2;box-shadow:0 8px 28px rgba(0,0,0,.18);border-radius:14px;padding:12px;display:none}#pwaInstallBox p{margin:0 0 8px;font-size:13px;line-height:1.45}#pwaInstallBtn{width:100%}#pwaCloseBtn{position:absolute;right:8px;top:6px;border:0;background:transparent;font-size:18px;color:#777}
@media(max-width:1300px){.wrap{grid-template-columns:1fr}.side,.assets,.editor,.preview{border-right:0;border-bottom:10px solid #f4f4f4}.bgGrid{grid-template-columns:repeat(4,1fr)}#card{width:min(92vw,560px)}}
@media(max-width:640px){.top{height:auto;min-height:110px;align-items:flex-start;flex-direction:column;gap:10px;padding:12px 14px}.brand h1{font-size:22px}.topBtns{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.topBtns button{font-size:13px;padding:10px 6px}.wrap{display:block}.side,.assets,.editor,.preview{padding:18px 14px}.catListGrid{grid-template-columns:repeat(4,1fr)}.cat{font-size:13px;height:52px}.designSwatch{height:48px}.typeGrid{grid-template-columns:repeat(3,1fr)}.bgGrid{grid-template-columns:repeat(3,1fr);max-height:none}.bgThumb{height:126px}.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}#card{width:calc(100vw - 28px);max-width:420px}.cardText{inset:46px 32px}.title{font-size:28px}.to{top:58px;font-size:16px}.deco{top:92px;font-size:16px}.msg{top:calc(118px + var(--msgTop));font-size:18px}.from{font-size:15px}.date{font-size:14px}#card.type-split .cardText{inset:46px 26px 46px 120px}}

/* ===== CK DOM CAPTURE 안정화 ===== */
#card{transform:none !important;}
#card *{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}

/* ===== CK FIX: 인사문구 박스 폭 조절 ===== */
.cardText .msg{
  width:var(--msgWidth) !important;
  left:calc((100% - var(--msgWidth)) / 2) !important;
  right:auto !important;
  transform:none !important;
  word-break:keep-all !important;
  overflow-wrap:break-word !important;
  text-align:inherit !important;
}


/* ===== CK FIX: 인사문구 가로 중앙 정렬 안정화 ===== */
.cardText .msg{
  width:var(--msgWidth) !important;
  left:calc((100% - var(--msgWidth)) / 2) !important;
  right:auto !important;
  transform:none !important;
  margin:0 !important;
  text-align:inherit !important;
  word-break:keep-all !important;
  overflow-wrap:break-word !important;
}


/* ===== CK FIX: 1~4 단일 좌측 통합 패널 ===== */
@media(min-width:1301px){
  .wrap{
    grid-template-columns:minmax(520px,34%) minmax(360px,28%) minmax(460px,38%) !important;
    width:100%;
  }

  .singleLeftPanel{
    padding:18px 22px !important;
    max-height:calc(100vh - 72px);
    overflow-y:auto;
    background:#fff;
  }

/* CK v64.14: PC 기준 카드(560x792)를 모바일에서 통째로 축소하여 줄바꿈/위치 동기화 */
:root{--mc-card-scale:1;--mc-card-base-w:560px;--mc-card-base-h:792px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(max-width:640px){
  .cardBox{position:relative !important;height:calc(792px * var(--mc-card-scale, .7) + 28px) !important;overflow:visible !important;}
  .cardBox #card{width:560px !important;max-width:none !important;min-width:560px !important;transform:scale(var(--mc-card-scale, .7)) !important;transform-origin:top center !important;}
  .cardBox #card .cardText{inset:72px 58px !important;}
  .cardBox #card .title{top:0 !important;font-size:38px !important;}
  .cardBox #card .to{top:78px !important;font-size:18px !important;}
  .cardBox #card .deco{top:118px !important;font-size:20px !important;}
  .cardBox #card .msg{top:calc(155px + var(--msgTop)) !important;}
  .cardBox #card .from{font-size:18px !important;}
  .cardBox #card .date{font-size:16px !important;}
}

.shareCardBox{position:relative;min-height:792px}
@media(max-width:640px){.shareCardBox{height:calc(792px * var(--mc-card-scale, .7)) !important;min-height:0 !important;overflow:visible !important}.shareCardBox #card{width:560px !important;max-width:none !important;min-width:560px !important;transform:scale(var(--mc-card-scale, .7)) !important;transform-origin:top center !important}}

</style>
</head>
<body>
<div class="shareViewWrap">
  <div class="shareBrand"><div><strong>💌 마음카드</strong><br><span>마음을 담은 카드, 한 장에</span></div></div>
  <div class="shareCardBox" id="cardMount"></div>
  <div class="shareNotice">카드의 <b>📍 상세보기</b> 버튼을 누르면 상세 정보가 열립니다.</div>
</div>
<script>

function applyUnifiedCardScale(){
  try{
    var vw = Math.max(320, window.innerWidth || document.documentElement.clientWidth || 560);
    var target = Math.min(420, Math.max(280, vw - 28));
    var isMobile = window.matchMedia && window.matchMedia('(max-width:640px)').matches;
    var scale = isMobile ? Math.min(1, target / 560) : 1;
    document.documentElement.style.setProperty('--mc-card-scale', String(scale));
  }catch(e){}
}
function syncSharedDetailButtonPosition(){
  try{
    var card = document.querySelector('[data-card-root="1"]') || document.querySelector('#card');
    var from = card ? (card.querySelector('#cardFrom') || card.querySelector('.from')) : null;
    var btn = document.getElementById('cardLinkBtnShared') || (card ? card.querySelector('.cardLinkBtn') : null);
    if(!card || !from || !btn || !btn.classList.contains('show')) return;
    requestAnimationFrame(function(){
      try{
        var cardRect = card.getBoundingClientRect(), fromRect = from.getBoundingClientRect();
        var btnH = btn.offsetHeight || 36;
        var scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mc-card-scale')) || 1;
        var top = ((fromRect.top - cardRect.top) / scale) - btnH - 10;
        top = Math.max(48, Math.min(Math.round(top), 700));
        card.style.setProperty('--detailBtnTop', top + 'px');
        btn.style.top = top + 'px'; btn.style.bottom = 'auto';
      }catch(e){}
    });
  }catch(e){}
}
applyUnifiedCardScale();
window.addEventListener('resize', function(){ applyUnifiedCardScale(); setTimeout(syncSharedDetailButtonPosition,40); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ applyUnifiedCardScale(); syncSharedDetailButtonPosition(); },80); });

function showError(msg){
  document.getElementById('cardMount').innerHTML = '<div class="error"><h1>📭 카드를 불러올 수 없습니다</h1><p>'+msg+'</p></div>';
}
async function loadCard(){
  try{
    var id = new URLSearchParams(location.search || '').get('id');
    if(!id) return showError('유효한 카드 링크가 아닙니다.');
    var res = await fetch('/.netlify/functions/cards?id=' + encodeURIComponent(id), {cache:'no-store'});
    if(!res.ok) return showError('카드 정보가 없거나 만료되었습니다.');
    var out = await res.json();
    var data = out && out.data ? out.data : out;
    if(!data || !data.cardHtml) return showError('카드 데이터 형식이 올바르지 않습니다.');
    document.title = data.title ? data.title + ' - 마음카드' : '마음카드';
    document.getElementById('cardMount').innerHTML = data.cardHtml;
    var btn = document.getElementById('cardLinkBtnShared') || document.querySelector('.cardLinkBtn');
    if(btn){
      var detailUrl = data.externalDetailUrl || (data.detailData ? ('/view.html?id=' + encodeURIComponent(id)) : '');
      if(detailUrl){
        btn.classList.add('show');
        btn.setAttribute('href', detailUrl);
        btn.onclick = function(e){ e.preventDefault(); location.href = detailUrl; };
        btn.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); location.href = detailUrl; } };
        syncSharedDetailButtonPosition();
      }else{
        btn.classList.remove('show'); btn.style.display='none';
      }
    }
  }catch(e){
    console.error(e);
    showError('잠시 후 다시 시도해 주세요.');
  }
}
loadCard();
</script>
</body>
</html>
